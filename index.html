<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Madison - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: white;
            overflow-x: hidden;
        }
        
        /* Simple subtle background */
        .simple-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(118, 75, 162, 0.05) 0%, transparent 50%);
            z-index: -1;
        }
        
        /* Hero */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .hero-content {
            text-align: center;
            max-width: 800px;
        }
        
        .title {
            font-size: 4.5rem;
            font-weight: 800;
            color: #000000;
            margin-bottom: 1.5rem;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #6b7280;
            line-height: 1.8;
            margin-bottom: 3rem;
        }
        
        .cta-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 1rem 2.5rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
            border: 2px solid #667eea;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            border-color: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: white;
            color: #374151;
            border: 2px solid #e5e7eb;
        }
        
        .btn-secondary:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .cta-buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="page-transition"></div>
    
    <!-- Simple Background -->
    <div class="simple-bg"></div>
    
    <nav class="navbar">
        <div class="nav-content">
            <a href="index.html" class="logo">David Madison</a>
            <div class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="projects.html">Projects</a>
                <a href="skills.html">Skills</a>
                <a href="experience.html">Experience</a>
                <button id="theme-toggle" class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>
    
    <main class="hero">
        <div class="hero-content">
            <h1 class="title">David Madison</h1>
            <p class="subtitle">Data Analyst & Full-Stack Developer | M.S. Data Analytics | U.S. Army Veteran</p>
            <div class="cta-buttons">
                <a href="https://www.linkedin.com/in/davidmadison95" target="_blank" class="btn btn-primary">
                    <i class="fab fa-linkedin"></i> LinkedIn
                </a>
                <a href="https://github.com/davidmadison95" target="_blank" class="btn btn-secondary">
                    <i class="fab fa-github"></i> GitHub
                </a>
            </div>
        </div>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
