<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Madison - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        /* Simple, clean styling to match other pages */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        
        .hero .container {
            text-align: center;
            max-width: 900px;
            padding: 2rem;
        }
        
        .title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }
        
        .subtitle {
            font-size: 1.25rem;
            color: #6b7280;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        
        .cta-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: #374151;
            border: 2px solid #e5e7eb;
        }
        
        .btn-secondary:hover {
            border-color: #667eea;
            color: #667eea;
        }
        
        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1.1rem;
            }
            
            .cta-buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Page Transition -->
    <div class="page-transition"></div>
    
    <!-- Particles Background -->
    <div id="particles-js" class="particles-container"></div>
    
    <!-- Background Pattern -->
    <div class="background-pattern"></div>
    
    <nav class="navbar">
        <div class="nav-content">
            <a href="index.html" class="logo">David Madison</a>
            <div class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="projects.html">Projects</a>
                <a href="skills.html">Skills</a>
                <a href="experience.html">Experience</a>
                <button id="theme-toggle" class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>
    
    <main class="hero">
        <div class="container">
            <h1 class="title">
                <span class="typewriter" data-text="Hi, I'm David. I turn data into business decisions."></span>
            </h1>
            <p class="subtitle">Data Analyst & Full-Stack Developer | M.S. Data Analytics | U.S. Army Veteran</p>
            <div class="cta-buttons">
                <a href="https://www.linkedin.com/in/davidmadison95" target="_blank" class="btn btn-primary">
                    <i class="fab fa-linkedin"></i> LinkedIn
                </a>
                <a href="https://github.com/davidmadison95" target="_blank" class="btn btn-secondary">
                    <i class="fab fa-github"></i> GitHub
                </a>
            </div>
        </div>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
